server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/account_service
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true